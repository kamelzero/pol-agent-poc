services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports: ["2181:2181"]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports: ["29092:9093"]

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pol
    ports: ["5432:5432"]

  app:
    build: .
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: pol
      POSTGRES_PASSWORD: postgres
      KAFKA_BROKER: kafka:9092
      H3_RES: 8
      SCENARIO_ID: demo
    depends_on: [kafka, db]
    command: python packages/ui/app.py
    ports: ["8501:8501"]

  bridges-ais:
    build: .
    environment:
      KAFKA_BROKER: kafka:9092
      H3_RES: 8
      SCENARIO_ID: demo
    depends_on: [kafka]
    command: python packages/bridges/ais_bridge.py
    restart: unless-stopped

  bridges-adsb:
    build: .
    environment:
      KAFKA_BROKER: kafka:9092
      H3_RES: 8
      SCENARIO_ID: demo
    depends_on: [kafka]
    command: python packages/bridges/adsb_bridge.py
    restart: unless-stopped

  bridges-ground:
    build: .
    environment:
      KAFKA_BROKER: kafka:9092
      H3_RES: 8
      SCENARIO_ID: demo
    depends_on: [kafka]
    command: python packages/bridges/ground_bridge.py
    restart: unless-stopped

  norms-ais:
    build: .
    environment:
      KAFKA_BROKER: kafka:9092
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: pol
      POSTGRES_PASSWORD: postgres
    depends_on: [kafka, db]
    command: python packages/normalizers/ais_normalizer.py
    restart: unless-stopped

  norms-adsb:
    build: .
    environment:
      KAFKA_BROKER: kafka:9092
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: pol
      POSTGRES_PASSWORD: postgres
    depends_on: [kafka, db]
    command: python packages/normalizers/adsb_normalizer.py
    restart: unless-stopped

  norms-ground:
    build: .
    environment:
      KAFKA_BROKER: kafka:9092
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: pol
      POSTGRES_PASSWORD: postgres
    depends_on: [kafka, db]
    command: python packages/normalizers/ground_normalizer.py
    restart: unless-stopped

  agent-maritime:
    build: .
    environment:
      KAFKA_BROKER: kafka:9092
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: postgres
    depends_on: [kafka]
    command: python packages/agents/maritime_agent.py
    restart: unless-stopped

  agent-air:
    build: .
    environment:
      KAFKA_BROKER: kafka:9092
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: postgres
    depends_on: [kafka]
    command: python packages/agents/air_agent.py
    restart: unless-stopped

  agent-ground:
    build: .
    environment:
      KAFKA_BROKER: kafka:9092
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: postgres
    depends_on: [kafka]
    command: python packages/agents/ground_agent.py
    restart: unless-stopped

  agent-fusion:
    build: .
    environment:
      KAFKA_BROKER: kafka:9092
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: postgres
    depends_on: [kafka]
    command: python packages/agents/fusion_agent.py
    restart: unless-stopped

  agent-explainer:
    build: .
    environment:
      KAFKA_BROKER: kafka:9092
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: postgres
      LLM_MODEL: fallback
      LLM_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on: [kafka]
    command: python packages/agents/explainer_agent.py
    restart: unless-stopped
