[project]
name = "pol-agent-poc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "fastapi",
  "uvicorn",
  "kafka-python",
  "psycopg[binary,pool]",
  "SQLAlchemy>=2",
  "h3",
  "shapely",
  "pyproj",
  "numpy",
  "pandas",
  "scikit-learn",
  "streamlit",
  "pydeck",
  "websockets",
  "python-dotenv",
  "orjson",
]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E","F","I","UP","B","C4","SIM"]
# Delegate line length to Black to avoid duplicate failures
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
